name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu && pip install -r backend/requirements.txt
      - run: cd backend && LIFELINE_OFFLINE=1 python -m pytest -q   # end-to-end test is skipped without data
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd frontend && npm ci && npm run build
